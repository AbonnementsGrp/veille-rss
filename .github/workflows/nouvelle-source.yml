name: Nouvelle source proposée par issue

# Une personne sans outillage propose une source par le formulaire d'issue.
# Ce workflow enquête sur l'adresse donnée et publie le résultat en commentaire ;
# quand un responsable pose l'étiquette « approuvé », il ajoute la source à la
# configuration et la veille repart d'elle-même (le push sur config/ déclenche
# la génération).

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: nouvelle-source-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Le formulaire est reconnu à son premier champ, pas à son étiquette : GitHub
  # n'applique pas une étiquette de modèle qui n'existe pas encore dans le
  # dépôt. Le workflow crée donc lui-même ses étiquettes au premier passage.
  enquete:
    name: Enquêter sur la source proposée
    # Les chaînes d'une expression GitHub vont entre guillemets simples ; le
    # marqueur est choisi sans apostrophe pour ne pas avoir à l'échapper.
    if: >
      contains(github.event.issue.body, '### Adresse de la page') &&
      (github.event.action != 'labeled' || github.event.label.name == 'nouvelle-source')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Une page qui ne livre rien à la session HTTP est rendue en JavaScript
      # par un Chromium sans tête, pour proposer `render: true` le cas échéant.
      - name: Mettre en cache le navigateur sans tête
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Installer le navigateur sans tête
        run: python -m playwright install --with-deps chromium

      # Le corps de l'issue est écrit par le demandeur : il passe par une
      # variable d'environnement, jamais par une interpolation dans le shell.
      - name: Enquêter
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/issue_source.py enquete || true

      - name: Publier le résultat en commentaire
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
        run: |
          for etiquette in "nouvelle-source:5319E7:Demande d'ajout d'une source" \
                           "enquete-ok:0E8A16:Prête à être ajoutée" \
                           "enquete-a-verifier:FBCA04:À vérifier avant approbation" \
                           "enquete-manuel:B60205:Demande un réglage manuel" \
                           "enquete-erreur:B60205:Adresse inexploitable" \
                           "approuvé:1D76DB:Ajout validé par un responsable"; do
            IFS=: read -r nom couleur description <<< "$etiquette"
            gh label create "$nom" --color "$couleur" --description "$description" --force
          done
          verdict=$(tr '_' '-' < verdict.txt)
          gh issue comment "$NUMERO" --body-file commentaire.md
          gh issue edit "$NUMERO" \
            --remove-label enquete-ok,enquete-a-verifier,enquete-manuel,enquete-erreur \
            --add-label "nouvelle-source,enquete-$verdict"

  ajout:
    name: Ajouter la source approuvée
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'approuvé' &&
      contains(github.event.issue.body, '### Adresse de la page')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # L'ajout refait l'enquête : un site en JavaScript a besoin du navigateur
      # ici aussi, sinon il serait refusé alors que l'enquête l'avait accepté.
      - name: Mettre en cache le navigateur sans tête
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Installer le navigateur sans tête
        run: python -m playwright install --with-deps chromium

      # Rejoue la demande sur l'état le plus récent de main jusqu'à ce que le
      # push passe, et rend compte dans l'issue quoi qu'il arrive. L'enquête
      # est refaite au passage : une adresse devenue injoignable est refusée.
      - name: Ajouter, enregistrer, rendre compte
        uses: ./.github/actions/appliquer-demande
        with:
          script: scripts/issue_source.py
          argument: ajouter
          fichiers: config/sites.yml
          message: Ajouter une source proposée par issue
          numero: ${{ github.event.issue.number }}
          titre: ${{ github.event.issue.title }}
          corps: ${{ github.event.issue.body }}
          token: ${{ github.token }}
