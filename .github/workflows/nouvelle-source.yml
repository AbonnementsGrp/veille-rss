name: Nouvelle source proposée par issue

# Une personne sans outillage propose une source par le formulaire d'issue.
# Ce workflow enquête sur l'adresse donnée et publie le résultat en commentaire ;
# quand un responsable pose l'étiquette « approuvé », il ajoute la source à la
# configuration et la veille repart d'elle-même (le push sur config/ déclenche
# la génération).

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: nouvelle-source-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  enquete:
    name: Enquêter sur la source proposée
    if: >
      contains(github.event.issue.labels.*.name, 'nouvelle-source') &&
      (github.event.action != 'labeled' || github.event.label.name == 'nouvelle-source')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Le corps de l'issue est écrit par le demandeur : il passe par une
      # variable d'environnement, jamais par une interpolation dans le shell.
      - name: Enquêter
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/issue_source.py enquete || true

      - name: Publier le résultat en commentaire
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
        run: |
          for etiquette in "enquete-ok:0E8A16:Prête à être ajoutée" \
                           "enquete-a-verifier:FBCA04:À vérifier avant approbation" \
                           "enquete-manuel:B60205:Demande un réglage manuel" \
                           "enquete-erreur:B60205:Adresse inexploitable" \
                           "approuvé:1D76DB:Ajout validé par un responsable"; do
            IFS=: read -r nom couleur description <<< "$etiquette"
            gh label create "$nom" --color "$couleur" --description "$description" --force
          done
          verdict=$(tr '_' '-' < verdict.txt)
          gh issue comment "$NUMERO" --body-file commentaire.md
          gh issue edit "$NUMERO" \
            --remove-label enquete-ok,enquete-a-verifier,enquete-manuel,enquete-erreur \
            --add-label "enquete-$verdict"

  ajout:
    name: Ajouter la source approuvée
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'approuvé' &&
      contains(github.event.issue.labels.*.name, 'nouvelle-source')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ajouter à la configuration
        id: ajout
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if python scripts/issue_source.py ajouter; then
            echo "reussi=true" >> "$GITHUB_OUTPUT"
          else
            echo "reussi=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Committer la configuration
        if: steps.ajout.outputs.reussi == 'true'
        env:
          NUMERO: ${{ github.event.issue.number }}
          TITRE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/sites.yml
          git commit -m "Ajouter une source proposée par issue (#$NUMERO)" -m "$TITRE"
          git pull --rebase
          git push

      - name: Rendre compte dans l'issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
          REUSSI: ${{ steps.ajout.outputs.reussi }}
        run: |
          gh issue comment "$NUMERO" --body-file commentaire.md
          if [ "$REUSSI" = "true" ]; then
            gh issue close "$NUMERO" --reason completed
          else
            gh issue edit "$NUMERO" --remove-label "approuvé"
          fi
