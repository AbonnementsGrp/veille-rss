name: Source supprimée par issue

# Suppression d'une source : configuration, historique et flux publié. Le
# commentaire de vérification récapitule ce qui sera retiré ; seule l'étiquette
# « approuvé », posée par un responsable, déclenche l'opération, irréversible.

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  actions: write   # relancer la génération une fois la demande appliquée

concurrency:
  group: supprimer-source-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  verification:
    name: Vérifier la source à supprimer
    if: >
      contains(github.event.issue.body, '### Source à supprimer') &&
      (github.event.action != 'labeled' || github.event.label.name == 'supprimer-source')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Vérifier
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/issue_supprimer_source.py enquete || true

      - name: Publier le résultat en commentaire
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
        run: |
          for etiquette in "supprimer-source:B60205:Demande de suppression d'une source" \
                           "enquete-ok:0E8A16:Prête à être appliquée" \
                           "enquete-erreur:B60205:Demande inexploitable" \
                           "approuvé:1D76DB:Validé par un responsable"; do
            IFS=: read -r nom couleur description <<< "$etiquette"
            gh label create "$nom" --color "$couleur" --description "$description" --force
          done
          verdict=$(cat verdict.txt)
          gh issue comment "$NUMERO" --body-file commentaire.md
          gh issue edit "$NUMERO" \
            --remove-label enquete-ok,enquete-erreur \
            --add-label "supprimer-source,enquete-$verdict"

  application:
    name: Supprimer la source approuvée
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'approuvé' &&
      contains(github.event.issue.body, '### Source à supprimer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Rejoue la demande sur l'état le plus récent de main jusqu'à ce que le
      # push passe (l'historique est aussi committé par la génération planifiée),
      # et rend compte dans l'issue quoi qu'il arrive.
      - name: Supprimer, enregistrer, rendre compte
        uses: ./.github/actions/appliquer-demande
        with:
          script: scripts/issue_supprimer_source.py
          fichiers: config/sites.yml data/history.json public/
          message: Supprimer une source sur demande par issue
          numero: ${{ github.event.issue.number }}
          titre: ${{ github.event.issue.title }}
          corps: ${{ github.event.issue.body }}
          token: ${{ github.token }}
