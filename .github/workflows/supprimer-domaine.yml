name: Domaine supprimé par issue

# Même mécanique que le renommage : le formulaire est reconnu à son premier
# champ, la vérification publie un commentaire, l'étiquette « approuvé »
# déclenche l'écriture. La suppression retire le domaine de la liste et du
# formulaire de source, et rattache ses sources à un autre domaine ou à
# « Autres » ; aucune source ni aucun article n'est supprimé.

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  actions: write   # relancer la génération une fois la demande appliquée

concurrency:
  group: supprimer-domaine-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  verification:
    name: Vérifier la suppression proposée
    if: >
      github.event.issue.state == 'open' &&
      contains(github.event.issue.body, '### Domaine à supprimer') &&
      (github.event.action != 'labeled' || github.event.label.name == 'supprimer-domaine')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Vérifier
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/issue_supprimer_domaine.py enquete || true

      # Une personne ayant les droits d'écriture n'attend pas d'approbation : sa
      # demande jugée prête s'applique aussitôt. Les autres, et les verdicts
      # « à vérifier », passent par l'étiquette.
      - name: Décider d'une application immédiate
        id: decision
        uses: ./.github/actions/confiance
        with:
          association: ${{ github.event.issue.author_association }}

      - name: Étiqueter, et publier le résultat s'il attend une approbation
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
          AUTO: ${{ steps.decision.outputs.auto }}
        run: |
          for etiquette in "supprimer-domaine:5319E7:Demande de suppression d'un domaine" \
                           "enquete-ok:0E8A16:Prête à être appliquée" \
                           "enquete-erreur:B60205:Demande inexploitable" \
                           "approuvé:1D76DB:Validé par un responsable"; do
            IFS=: read -r nom couleur description <<< "$etiquette"
            gh label create "$nom" --color "$couleur" --description "$description" --force
          done
          verdict=$(cat verdict.txt)
          gh issue edit "$NUMERO" \
            --remove-label enquete-ok,enquete-erreur \
            --add-label "supprimer-domaine,enquete-$verdict"
          if [ "$AUTO" != "true" ]; then
            gh issue comment "$NUMERO" --body-file commentaire.md
          fi

      - name: Appliquer sans attendre
        if: steps.decision.outputs.auto == 'true'
        uses: ./.github/actions/appliquer-demande
        with:
          script: scripts/issue_supprimer_domaine.py
          fichiers: config/sites.yml .github/ISSUE_TEMPLATE/nouvelle-source.yml
          message: Supprimer un domaine sur demande par issue
          numero: ${{ github.event.issue.number }}
          titre: ${{ github.event.issue.title }}
          corps: ${{ github.event.issue.body }}
          token: ${{ github.token }}
          auto: "true"

  application:
    name: Supprimer le domaine approuvé
    if: >
      github.event.issue.state == 'open' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'approuvé' &&
      contains(github.event.issue.body, '### Domaine à supprimer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Rejoue la demande sur l'état le plus récent de main jusqu'à ce que le
      # push passe, et rend compte dans l'issue quoi qu'il arrive.
      - name: Supprimer, enregistrer, rendre compte
        uses: ./.github/actions/appliquer-demande
        with:
          script: scripts/issue_supprimer_domaine.py
          fichiers: config/sites.yml .github/ISSUE_TEMPLATE/nouvelle-source.yml
          message: Supprimer un domaine sur demande par issue
          numero: ${{ github.event.issue.number }}
          titre: ${{ github.event.issue.title }}
          corps: ${{ github.event.issue.body }}
          token: ${{ github.token }}
